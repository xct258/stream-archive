# ============================================================
# stream-archive 配置
#
# 容器运行时所有可变数据都在 /data（docker-compose 挂载 ./data:/data）：
#   /data/config.toml          本文件
#   /data/rec/                 录制源目录（录播姬输出，按需挂载）
#   /data/work/                处理缓存
#   /data/videos/              归档（压制版/原文件）
#   /data/state/               任务状态与月稿件映射
#   /data/logs/                日志
#
# 所有路径都可以改成绝对路径；宿主机直接运行时不需要 /data 前缀。
# ============================================================

[general]
# 服务器名称，只用于日志标识
server_name = "nas"

# 处理中的缓存目录；实际路径为 <work_dir>/<主播归档名>/<开播时间>/
work_dir = "/data/work"

# 归档根目录；实际路径为 <videos_dir>/<主播归档名>/压制版|原文件/YYYY/MM/YYYY-MM-DD/
videos_dir = "/data/videos"

# 任务状态（JSON）、运行锁、月稿件映射存放目录
data_dir = "/data/state"

# 日志目录
log_dir = "/data/logs"


[watch]
# 监控的录制源目录，可以写多个（录播姬的输出目录）
source_folders = ["/data/rec"]

# 轮询间隔（秒）
poll_seconds = 300

# 目录里所有文件超过这么多分钟没有写入，就判定为“已下播”，可以开始处理
idle_minutes = 20


# ============================================================
# 全局默认参数（每个主播都可以用同名子表覆盖）
# ============================================================

[danmaku]
# 是否把弹幕烧进画面（关闭时只做 FLV->MP4 封装后投稿原片）
enabled = true

# DanmakuFactory 可执行文件（镜像里会装到 /usr/local/bin）
factory = "/usr/local/bin/DanmakuFactory"

# 弹幕字体；镜像里安装的是 Noto Sans CJK SC
# 留空则使用 DanmakuFactory 默认的 Microsoft YaHei（Linux 上可能缺字）
font_name = "Noto Sans CJK SC"

# ASS 弹幕样式：字号和不透明度（0-255，255 为完全不透明）
font_size = 50
opacity = 200

# 视频时长与最后一条弹幕时间的最大允许差值（秒）
# 超过就认为录制/弹幕不同步，跳过压制，避免投出音画错位的视频。
max_diff_seconds = 25


[encode]
# x264 质量参数：CRF 越小画质越好、体积越大
crf = 21

# x264 预设：veryfast 在 8 核机器上大约 2~2.5 倍速
preset = "veryfast"

# H.264 profile
profile = "high"

# 编码线程数，0 表示交给 ffmpeg 自动决定
threads = 0

# 是否优先尝试 Intel QSV 硬件编码；失败（无核显/驱动）会自动回退 CPU
try_qsv = true
qsv_quality = 20
qsv_preset = "medium"

# ---- 可选高能进度条 ----
# 在画面底部叠加弹幕密度曲线：已播放区域高亮，未播放区域压暗，白色竖线是播放头。
# 生成失败会自动退化为无进度条压制，不阻塞任务。
progress_bar = false
# 进度条高度（像素）；1080p 建议 48-80
progress_bar_height = 64
# 整体不透明度 0-1
progress_bar_opacity = 0.6
# 曲线颜色 0xRRGGBB 或 #RRGGBB
progress_bar_color = "0x2ED6FF"
# 平滑窗口（秒），越大曲线越平缓
progress_bar_smooth = 60


[upload]
# 是否投稿到 B 站（单个主播可用 [streamers.upload] 覆盖）
enabled = true

# biliup 可执行文件
biliup = "/usr/local/bin/biliup"

# 投稿账号 cookies；不同主播可以用不同账号
cookies = "/data/cookies/bilibili/cookies-默认账号.json"

# 分区、版权（1=自制 2=转载）
tid = 17
copyright = 2

# 标签，逗号拼接后传给 biliup
tags = ["直播回放"]

# 标题模板，可用 {date}（2026年11月13日）、{title}（直播标题）、{streamer}
title_template = "{date} [{title}]"

# 简介模板，可用占位符：
#   {title} 直播标题   {streamer} 主播归档名   {platform} 录制平台
#   {danmaku_count} 弹幕总数   {cover_time} 封面时间   {cover_p} 封面所在分P
# 空行和缩进原样保留。
desc_template = """录制平台：{platform}
弹幕总数：{danmaku_count}
封面时间：{cover_p}P {cover_time}"""


[archive]
# 是否按自然日清理旧录播
cleanup_enabled = true

# 保留天数（含当天）
retention_days = 15

# 单次清理最多删几个日期目录，防止配置写错一次删光
max_delete_per_run = 8

# 投稿成功后是否立即删除本地“压制版 + 原文件”
# 默认 false：本地保留一份，确认 B 站稿件正常后再手动清理。
delete_after_upload = false


[append]
# 按月投稿：同一主播同一自然月的视频归到一个 B 站稿件。
#   当月第一次：用第一个视频新建稿件（成为 P1）
#   之后的视频/场次：biliup append 追加为新的分P
# 映射文件记录 “主播归档名|YYYY-MM=BV号”，重跑不会重复追加。
enabled = false

# 映射文件；留空表示 <data_dir>/append_month_vid.map
map_file = ""

# 追加哪个版本：raw=原文件（默认），pressed=压制版
source = "raw"

# 标题/简介模板，可用 {streamer} 主播归档名、{month}=2026-11、{month_cn}=2026年11月
title_template = "{streamer} {month_cn} 直播回放合集"
desc_template = "本稿件为{streamer}{month_cn}原版直播回放合集，每次直播追加为一个分P。"

# 月稿件封面；留空则不传封面
cover = ""


[webdav]
# 把 XML 弹幕文件上传到 WebDAV（直接用 HTTP，不需要安装 rclone）
enabled = false

# WebDAV 根地址（到 dav 根，不要带具体目录；建议使用 https）
url = "https://pan.example.com/dav"
username = ""
password = ""

# 目录模板，可用 {streamer} {yyyy} {mm} {dd} {month} {date}
path = "/danmaku/{streamer}/{yyyy}/{mm}/{date}"

# 对外访问前缀，用于月稿件简介里的 {pan_url}
public_url = ""

# 只上传成功追加到月稿件的 XML；false 表示本场全部 XML 都上传
only_appended = false

# 自签名证书时设为 true
insecure = false

# 单次请求超时（秒）
timeout = 60


[recorder]
# 录播姬全局配置文件；sync 命令会把 cookies 和各主播房间同步进去
# 不使用录播姬时可以保持默认，sync 会跳过
config_path = "/data/recorder/config.json"

# 录播姬使用的 cookie JSON（和投稿账号无关）
record_cookie_json = "/data/cookies/bilibili/cookies-录播账号.json"


[github]
# 是否从私有仓库同步 cookies
# 私有仓库需要 token；token 从环境变量 GITHUB_TOKEN 或 token_file 读取。
enabled = false
repo = "owner/private-config"
branch = "main"
token_file = "/data/.github_token"

# remote 是仓库内路径，local 是落盘路径
sources = [
  { remote = "cookies/record.json", local = "/data/cookies/bilibili/cookies-录播账号.json" },
  { remote = "cookies/upload.json", local = "/data/cookies/bilibili/cookies-默认账号.json" },
]


# ============================================================
# 主播列表
#
# 匹配规则：
#   1. 录制文件名里的主播名命中 aliases / name / id；
#   2. 或者目录属于该主播的 source_folders，且只有一个主播声明了该目录。
# 匹配不到时会跳过并提示在配置里补一段 [[streamers]]。
# ============================================================

[[streamers]]
# 唯一标识，用于状态文件、日志、命令行参数
id = "demo"
# 归档目录名，会出现在 videos/<name>/... 和 work_dir/<name>/...
name = "主播A"
# 录播姬里的昵称（文件名最后一段），可以有多个
aliases = ["直播间昵称"]
enabled = true

# 录播姬房间号；不填则不同步录制配置
room_id = 123456

# 可选：只从这些目录收这个主播的录制（不填则用全局 [watch].source_folders）
# source_folders = ["/data/rec/直播间昵称"]

# 该主播的投稿账号和稿件模板
[streamers.upload]
cookies = "/data/cookies/bilibili/cookies-默认账号.json"
source = "https://live.bilibili.com/123456"
tags = ["直播回放"]

# 该主播的按月投稿覆盖
# [streamers.append]
# enabled = true
# source = "pressed"

# 该主播的 WebDAV 覆盖
# [streamers.webdav]
# enabled = true
# path = "/danmaku/{streamer}/{date}"


