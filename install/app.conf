#!/bin/bash
# ============================================================
# 镜像构建与应用配置
#   构建配置（CI 读取）   ：镜像名 / 标签 / 架构
#   应用配置（模板读取） ：依赖安装
#   启动流程（不在本文件）：startup/prepare.sh 每次启动
#                          startup/once.sh    只执行一次
#                          startup/main.sh    容器主进程
# ============================================================

# ------------------------------------------------------------
# 1. 构建配置：镜像仓库与标签（推送到 Docker Hub）
# ------------------------------------------------------------
IMAGE_REPO=xct258/stream-archive
IMAGE_TAG=latest
PLATFORMS=linux/amd64,linux/arm64

# ------------------------------------------------------------
# 2. 系统依赖（apt）：一行一个
# ------------------------------------------------------------
APT_PACKAGES=(
  ca-certificates
  curl
  wget
  ffmpeg
  python3
  python3-pip
  python3-venv
  python3-setuptools
  python3-wheel
  fonts-noto-cjk
  xz-utils
  unzip
)

# ------------------------------------------------------------
# 3. 常用软件快捷开关（true / false）
# ------------------------------------------------------------
INSTALL_7Z=false

# ------------------------------------------------------------
# 4. Python 依赖（pip 包）：一行一个
#    本项目运行时零第三方依赖；这里留空。
# ------------------------------------------------------------
PYTHON_PACKAGES=(
)

# ------------------------------------------------------------
# 5. 自定义安装脚本（构建时执行一次）
#    下载 DanmakuFactory、biliup，并安装本项目。
# ------------------------------------------------------------
INSTALL_CUSTOM=true

# ------------------------------------------------------------
# 5.0 默认安装录播姬
#     镜像里带 BililiveRecorder CLI，启动时由 stream-archive 维护配置
# ------------------------------------------------------------
INSTALL_RECORDER=true
# 录播姬版本；留空使用 latest
RECORDER_VERSION=v2.20.0

# ------------------------------------------------------------
# 5.1 内置语音转文本（faster-whisper）
#     true  : 镜像里安装 faster-whisper（约 200-300MB），运行时可开箱即用
#     false : 不安装，镜像更小；仍可通过外部 ASR 服务使用
#     模型不打包进镜像，首次转写时下载到 /data/asr/models（或提前放进去）
# ------------------------------------------------------------
INSTALL_ASR=true

# ------------------------------------------------------------
# 5.2 监控界面（FastAPI + uvicorn）
#     true  : 安装 Web 依赖，可在配置里启用 [web]
#     false : 不安装，镜像更小
# ------------------------------------------------------------
INSTALL_WEB=true

# ------------------------------------------------------------
# 6. 日志模块（构建时下载，安装到 /opt/startup/log.sh）
#    来源：xct258/common 仓库，固定到提交 SHA
# ------------------------------------------------------------
LOG_LIB_URL=https://raw.githubusercontent.com/xct258/common/3d48863b2ba5c1de4cfacaa77993e35c77d3d675/%E8%84%9A%E6%9C%AC%E5%B7%A5%E5%85%B7/shell/%E6%97%A5%E5%BF%97%E8%AE%B0%E5%BD%95%E5%92%8C%E6%8E%A8%E9%80%81/log.sh

# ------------------------------------------------------------
# 7. 应用源码（install/custom-install.sh 读取）
#    APP_REF 可以是分支、tag 或提交 SHA；镜像构建前请确保已推送。
# ------------------------------------------------------------
APP_REPO=xct258/stream-archive
APP_REF=main
